<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<meta name="robots" content="noindex">
<title>Guide Step 2</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1280px;height:1080px;overflow:hidden;background:#f6f6f4;font-family:Inter,system-ui,sans-serif;color:#111}
.bar{height:96px;display:flex;align-items:center;gap:18px;padding:0 40px;background:#111;color:#fff}
.num{background:#E11A45;border-radius:999px;padding:8px 18px;font-weight:800;font-size:22px;letter-spacing:.04em}
.bar h1{font-size:32px;font-weight:800;letter-spacing:-.02em}
.shot{position:relative;margin:28px 40px 0;width:1200px;height:928px;overflow:hidden;border-radius:14px;border:1px solid #ddd;background:#fff;box-shadow:0 18px 40px -20px rgba(0,0,0,.35)}
.shot iframe{position:absolute;left:-40px;top:0;width:1280px;height:2200px;border:0}
svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tip{position:absolute;background:#E11A45;color:#fff;font-weight:800;font-size:26px;padding:12px 22px;border-radius:12px;box-shadow:0 10px 24px -10px rgba(225,26,69,.7);white-space:nowrap;display:none;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="bar"><span class="num">STEP 3</span><h1>Click <u>Play / Main</u> on the game you want</h1></div>
<div class="shot" id="shot">
<iframe id="f" src="/games" scrolling="no"></iframe>
<svg id="ov"></svg>
<div class="tip" id="tip">Click Play / Main to start</div>
</div>
<script>
{
const f=document.getElementById('f'), ov=document.getElementById('ov'), tip=document.getElementById('tip');
f.addEventListener('load',()=>setTimeout(()=>{
  const d=f.contentDocument, g=d.querySelector('.games'); if(!g) return;
  const hdr=d.querySelector('header.site'); if(hdr) hdr.style.position='static';
  const off=g.getBoundingClientRect().top-24; f.style.top=(-off)+'px';
  const ox=-40;
  const bs=[...d.querySelectorAll('.games .btn.dark')].map(b=>b.getBoundingClientRect());
  const tipY=bs[0].bottom-off+90, tipX=600;
  let s=`<defs><marker id="h" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="16" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#E11A45"/></marker></defs>`;
  bs.forEach(r=>{
    const cx=r.left+r.width/2+ox, cy=r.top+r.height/2-off, rx=r.width/2+24, ry=r.height/2+16;
    s+=`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="#E11A45" stroke-width="6"/>`;
    const sx=Math.max(tipX-150,Math.min(tipX+150,cx)), sy=tipY;
    s+=`<path d="M${sx},${sy} Q ${(sx+cx)/2},${cy+ry+40} ${cx},${cy+ry+8}" fill="none" stroke="#E11A45" stroke-width="6" stroke-linecap="round" marker-end="url(#h)"/>`;
  });
  ov.innerHTML=s;
  tip.style.left=tipX+'px'; tip.style.top=tipY+'px'; tip.style.display='block';
},300));
}
</script>
</body>
</html>
