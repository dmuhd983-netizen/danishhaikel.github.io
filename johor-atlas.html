<style>
:root{--crimson:#E11A45;--yellow:#EDC92C;--ink:#24131C;--cream:#FBF8EC}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--crimson);color:var(--cream);font-family:"Archivo",system-ui,sans-serif;padding:24px}
.box{width:min(100%,420px);display:flex;flex-direction:column;gap:18px}
.lock{width:64px;height:64px;border-radius:50%;background:var(--yellow);display:grid;place-items:center}
h1{margin:0;font-weight:900;font-stretch:120%;font-size:clamp(2.2rem,8vw,3rem);line-height:.95}
p{margin:0;line-height:1.5}
form{display:flex;flex-direction:column;gap:12px;margin-top:6px}
input[type=password]{font:inherit;font-size:1.05rem;padding:14px 18px;border-radius:999px;border:2px solid var(--cream);background:rgba(251,248,236,.12);color:var(--cream)}
input[type=password]::placeholder{color:rgba(251,248,236,.7)}
label.rem{display:flex;gap:8px;align-items:center;font-size:.95rem}
label.rem input{accent-color:var(--yellow);width:18px;height:18px}
button{font:inherit;font-weight:800;font-size:1rem;padding:14px 18px;border-radius:999px;border:none;background:var(--yellow);color:var(--ink);cursor:pointer}
button:disabled{opacity:.7;cursor:wait}
.err{min-height:1.4em;font-weight:700;color:var(--yellow)}
a{color:var(--cream)}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
</style>

const KEY = 'atlas-pw'
const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0))
async function unlock(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:u8(DATA.s), iterations:DATA.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt'])
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(DATA.i)}, key, u8(DATA.c))
  return new TextDecoder().decode(plain)
}
function show(html){ document.open(); document.write(html); document.close() }
const err = document.getElementById('err'), go = document.getElementById('go')
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault()
  const pw = document.getElementById('pw').value
  go.disabled = true; go.textContent = 'Opening...'; err.textContent = ''
  try {
    const html = await unlock(pw)
    if (document.getElementById('rem').checked) { try { localStorage.setItem(KEY, pw) } catch(_){} }
    show(html)
  } catch(_) {
    err.textContent = 'Wrong password. Check it and try again.'
    go.disabled = false; go.textContent = 'Open the atlas'
  }
})
;(async () => {
  let saved = null
  try { saved = localStorage.getItem(KEY) } catch(_){}
  if (!saved) return
  try { show(await unlock(saved)) } catch(_) { try { localStorage.removeItem(KEY) } catch(__){} }
})()
</script>
