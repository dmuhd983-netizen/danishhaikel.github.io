<style>
:root{--text:#111111;--muted:#6B6B6B;--line:#D6D6D2;--soft:#F6F6F4;--red:#E11A45}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FFFFFF;color:var(--text);font-family:"Inter",system-ui,-apple-system,sans-serif;padding:24px;-webkit-font-smoothing:antialiased}
.box{width:min(100%,400px);display:flex;flex-direction:column;gap:16px}
.lock{width:52px;height:52px;border-radius:10px;background:var(--soft);display:grid;place-items:center}
.lock svg{stroke:#111}
h1{margin:0;font-weight:800;font-size:clamp(2rem,7vw,2.6rem);line-height:1.05;letter-spacing:-.035em}
p{margin:0;line-height:1.55;color:var(--muted)}
form{display:flex;flex-direction:column;gap:12px;margin-top:8px}
input[type=password]{font:inherit;font-size:1rem;padding:13px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--text)}
input[type=password]::placeholder{color:#9A9A96}
label.rem{display:flex;gap:8px;align-items:center;font-size:.95rem;color:var(--muted)}
label.rem input{accent-color:#111;width:17px;height:17px}
button{font:inherit;font-weight:600;font-size:1rem;padding:13px 18px;border-radius:999px;border:none;background:#111;color:#fff;cursor:pointer}
button:hover{background:#333}
button:disabled{opacity:.7;cursor:wait}
.err{min-height:1.4em;font-weight:600;color:var(--red)}
a{color:var(--text);font-weight:600;text-decoration:none;border-bottom:1px solid var(--text)}
:focus-visible{outline:2px solid #111;outline-offset:3px}
</style>

const KEY = 'atlas-pw'
const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0))
async function unlock(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:u8(DATA.s), iterations:DATA.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt'])
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(DATA.i)}, key, u8(DATA.c))
  return new TextDecoder().decode(plain)
}
function show(html){ document.open(); document.write(html); document.close() }
const err = document.getElementById('err'), go = document.getElementById('go')
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault()
  const pw = document.getElementById('pw').value
  go.disabled = true; go.textContent = 'Opening...'; err.textContent = ''
  try {
    const html = await unlock(pw)
    if (document.getElementById('rem').checked) { try { localStorage.setItem(KEY, pw) } catch(_){} }
    show(html)
  } catch(_) {
    err.textContent = 'Wrong password. Check it and try again.'
    go.disabled = false; go.textContent = 'Open the atlas'
  }
})
;(async () => {
  let saved = null
  try { saved = localStorage.getItem(KEY) } catch(_){}
  if (!saved) return
  try { show(await unlock(saved)) } catch(_) { try { localStorage.removeItem(KEY) } catch(__){} }
})()
